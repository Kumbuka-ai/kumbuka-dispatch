# What each step of next does, worded as the act (DEC-0043 R21;
# PositivePhrasingLintTest).

send=Sends the draft: the task is open to executors.
recall=Takes the sent task back to draft, to change it and send it again.
claim=Takes up this task; you become its holder.
claimNext=Retiring: claim names the task. Takes up the next open task addressed to you; the service picks which.
release=Gives the task back; it is open to be taken again.
defer=Gives the task back until an instant you name; from then on it is open to be taken again.
renew=Extends your hold.
ask=Pauses the task and asks the commissioner a question.
answer=Answers the executor's question; the work continues.
hold=Pauses the task while it waits on a dependency or on something external.
resume=Continues the paused task.
deliver=Delivers your answer and its metadata to the commissioner, who accepts it or sends it back.
rework=Sends the delivered answer back to its holder with a remark.
accept=Accepts, as the commissioner, the answer the holder delivered, and closes the task.
reject=Declines the commission and closes the task.
fail=Closes the task as failed, with a remark.
withdraw=Withdraws the commission and closes the task.
readTheCommission=Reads the commission: the task's text, the work this claim takes on. Call it next, before you start the work.
readTheAnswer=Reads the delivered answer, part "return". Read it before you accept it.
listAfterAnEmptyDraw=Lists the tasks of this bracket kind with their state and apparatus.
