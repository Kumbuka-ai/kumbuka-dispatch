# The description of every argument (DEC-0043 R17, R21;
# PositivePhrasingLintTest).

scope=the scope's name, a DNS label
selector=the declared bracket kind, such as "sprint"
address=the complete address of the task, dispatch://<scope>/<selector>/<number>.<sub>
conflictToken=the conflict token handed out with your last read of this task
receipt=the receipt your claim handed out for this task
duration=how long your hold lasts, as an ISO-8601 duration such as PT2H; PT30M, thirty minutes, when left out or null
confirmation=the confirmation a refusal handed out for closing a bracket root with unfinished children; left out or null, the call closes a root once its children are finished
remarkRequired=why, in a sentence the other side can act on
remarkOptional=a remark kept with the task; left out or null, the call records the step alone
fields=What this call writes into the task. Values live here; the arguments that name the target live beside it.
claimIdempotencyKey=a key of your own: repeating the claim with it while you hold the task returns the same task with a new receipt and leaves your hold as it is; left out or null, each claim stands on its own
claimNextIdempotencyKey=a key of your own: repeating the draw with it while you hold the task it drew returns that task with a new receipt; left out or null, each draw stands on its own
createIdempotencyKey=a key of your own: a retried create with it creates once; left out or null, each call creates a task of its own
annotateIdempotencyKey=a key of your own: repeating the addendum with it returns the task and attaches the addendum once; left out or null, each call attaches one
claimNextApparatus=Which apparatus you draw for. Every task is addressed to an apparatus: the kind of executor it is meant for, such as "code" or "review". Give one or more patterns, matched as alternatives. "*" stands for any run of characters, so "agent-*" matches "agent-backend". Case-sensitive. A pattern of only "*" is refused. dispatch_query lists open tasks with their apparatus.
deferNotBefore=the instant from which an executor can take the task up again, as ISO-8601 such as 2026-10-07T09:00:00Z
askQuestion=what you need the commissioner to decide
askOptions=the answers the commissioner can choose from; left out or null, the question takes free text, and free_text is then true
askFreeText=true where the commissioner may answer in free text; false when left out or null, and then options are needed
answerOption=one of the question's options; give this or text, and leave it out or null when you give text
answerText=a free-text answer, where the question admits one; give this or option, and leave it out or null when you give option
holdReason=why the task waits
deliverText=your answer
deliverMetadata=your own keys on the answer: each value a string or a list of strings; left out or null, the answer carries its text alone
createParent=the complete address of a bracket root, to add a child to that bracket; left out or null, the call opens a new bracket
createTitle=the task's title
createApparatus=the kind of executor the task is addressed to, such as "code"
createText=the commission's text; left out or null, the draft starts with its title alone, and dispatch_update adds the text
createMetadata=your own keys on the task: each value a string or a list of strings; left out or null, the task starts with an empty set
updateTitle=the new title; left out or null, the title stays as it is
updateApparatus=the new apparatus; left out or null, the apparatus stays as it is
updateText=the new text of the commission; left out or null, the text stays as it is
updateMetadata=your own keys on the task, replacing the ones it has: each value a string or a list of strings; left out or null, the metadata stays as it is
readTextPart=the part to read
queryState=states to list, comma-separated: draft, open, active, on_hold, delivered, closed; left out or null, every state
queryApparatus=apparatus patterns, comma-separated; "*" stands for any run of characters; left out or null, every apparatus
queryBracket=bracket numbers, comma-separated; left out or null, every bracket
queryAddress=complete addresses of tasks of this bracket kind, comma-separated; left out or null, every task
queryPageSize=how many tasks a page holds at most, a whole number from 1 to 200; 50 when left out or null
queryAfter=the next_cursor of the previous page; left out or null, the first page
querySort=what the list is sorted by; id when left out or null
queryDirection=the direction of the sort; asc when left out or null
annotateText=the addendum's text
annotatePart=the text it supplements
relateCuratedIn=the complete address of the task this one was curated into
