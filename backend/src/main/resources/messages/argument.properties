# The description of every argument (DEC-0043 R17, R21;
# PositivePhrasingLintTest).

scope=the scope's name, a DNS label
selector=the declared bracket kind, such as "sprint"
address=the complete address of the task, dispatch://<scope>/<selector>/<number>.<sub>
conflictToken=the conflict token handed out with your last read of this task
receipt=the receipt your claim handed out for this task
duration=how long your hold lasts, as an ISO-8601 duration such as PT2H; PT30M, thirty minutes, when left out or null
confirmation=the confirmation a refusal handed out for closing a bracket root with unfinished children; left out or null, the call closes a root once its children are finished
remarkRequired=why, in a sentence the other side can act on
remarkOptional=a remark kept with the task; left out or null, the call records the step alone
fields=What this call writes into the task. Values live here; the arguments that name the target live beside it.
claimIdempotencyKey=a key of your own, 1 to 255 printable ASCII characters, kept for 24 hours: repeating the claim with it while you hold the task returns the same task with a new receipt and leaves your hold as it is; left out or null, each claim stands on its own
createIdempotencyKey=a key of your own, 1 to 255 printable ASCII characters, kept for 24 hours: a retried create with it and the same arguments creates once and answers that task, also once it is sent; with other arguments, or once that draft is deleted, a retry with it is refused; left out or null, each call creates a task of its own
annotateIdempotencyKey=a key of your own, 1 to 255 printable ASCII characters, kept for 24 hours: repeating the addendum with it returns the task and attaches the addendum once; left out or null, each call attaches one
deferNotBefore=the instant from which an executor can take the task up again, as ISO-8601 such as 2026-10-07T09:00:00Z
askQuestion=what you need the commissioner to decide
askOptions=the answers the commissioner can choose from; left out or null, the question takes free text, and free_text is then true
askFreeText=true where the commissioner may answer in free text; false when left out or null, and then options are needed
answerOption=one of the question's options; give this or text, and leave it out or null when you give text
answerText=a free-text answer, where the question admits one; give this or option, and leave it out or null when you give option
holdReason=why the task waits
deliverText=your answer
deliverMetadata=your own keys on the answer: each value a string or a list of strings; left out or null, the answer carries its text alone
createParent=the complete address of a running instance of the selector, dispatch://<scope>/<selector>/<number>, for the task to join; left out or null, the call starts an instance of the selector with the task as its first
createTitle=the task's title
createApparatus=the role the task is addressed to, such as "code": 1 to 128 of A-Z, a-z, 0-9, '.', '_' and '-'; left out or null, the task is addressed to any role
createText=the commission's text; left out or null, the draft starts with its title and its other fields alone, and an update adds the text
createActivity=the name of an activity of the version of the task's instance, as the read of the definition lists them; left out or null, the version's only activity, and the call needs the name where the version declares several
createConcerns=the complete address of another task of the same instance that this task concerns, dispatch://<scope>/<selector>/<number>.<sub>; left out or null, the task stands on its own
createCriteria=the criteria of the commission, each a text, in their order; the service gives each its identifier; left out or null, the list is empty
createFreeFields=your own keys on the task, a JSON object the service keeps as given and returns; left out or null, the task carries its other fields alone
createTrigger=a reference to what started the instance, such as the address of a worklist item, kept as given, for a call that leaves parent out and starts one; a call with parent takes it as an argument fault; left out or null, the instance records its start by this call alone
createReferences=addresses of the objects outside the service the instance serves, each set as a reference of the kind reference, for a call that leaves parent out and starts one; a call with parent takes them as an argument fault; left out or null, the list is empty
createMetadata=your own keys on the task: each value a string or a list of strings; left out or null, the task starts with an empty set
updateTitle=the new title; left out or null, the title stays as it is
updateApparatus=the new role, in the form a create takes; left out or null, the role stays as it is
updateText=the new text of the commission; left out or null, the text stays as it is
updateActivity=the name of the new activity, of the version of the task's instance; left out or null, the activity stays as it is
updateConcerns=the complete address of the other task of the same instance this task concerns now; left out or null, it stays as it is
updateCriteria=the new criteria, each a text, in their order, in place of the draft's; left out or null, the criteria stay as they are
updateFreeFields=your own keys on the task, a JSON object in place of the draft's; left out or null, they stay as they are
updateClear=the fields to empty, each by its path: fields.apparatus, fields.activity, fields.concerns, fields.criteria, fields.free_fields or fields.text; a field is either cleared or given a value in one call; left out or null, every field keeps its value
draftConflictToken=the conflict token of your last answer on this task; the call needs it, and answers CONFLICT_TOKEN_MISSING when it is left out or null
updateMetadata=your own keys on the task, replacing the ones it has: each value a string or a list of strings; left out or null, the metadata stays as it is
readTextPart=the part to read
queryState=states to list, comma-separated: draft, open, active, on_hold, delivered, closed; left out or null, every state
queryApparatus=apparatus patterns, comma-separated; "*" stands for any run of characters; left out or null, every apparatus
queryBracket=bracket numbers, comma-separated; left out or null, every bracket
queryAddress=complete addresses of tasks of this bracket kind, comma-separated; left out or null, every task
queryPageSize=how many tasks a page holds at most, a whole number from 1 to 200; 50 when left out or null
queryAfter=the next_cursor of the previous page; left out or null, the first page
querySort=what the list is sorted by; id when left out or null
queryDirection=the direction of the sort; asc when left out or null
annotateText=the addendum's text
annotatePart=the text it supplements
relateCuratedIn=the complete address of the task this one was curated into
queryTag=one tag token, such as component:router; the listing holds the tasks that carry the tag, and is empty for a token the scope leaves undeclared; left out or null, every task
readDefinitionVersion=the number of the version, a whole number from 1; left out or null, the active version
tagAttachTag=the token of a tag the scope of the task declares, such as component:router
tagDetachTag=the token of a tag the task carries, such as component:router
startTitle=the instance's title, kept as given for its whole life
startInput=the input text of the instance; left out or null, the instance starts with its title alone
startTrigger=a reference to what started the instance, such as the address of a worklist item, kept as given; left out or null, the instance records its start by this call alone
startItems=addresses of the worklist items the instance serves, each set as a reference of the kind item with the start; left out or null, the list is empty
startReferences=addresses of the other objects outside the service the instance serves, each set as a reference of the kind reference with the start; left out or null, the list is empty
startValues=the field values of the start contract of the version, by field name, each in its field's type: true or false, a number, a date as YYYY-MM-DD, a text of up to 4096 characters, or a value of the field's enumeration, as the read of the definition lists them; a field the contract requires is needed here; left out or null, the start carries an empty set
instanceAddress=the complete address of the instance, dispatch://<scope>/<selector>/<number>
instanceConflictToken=the conflict token of your last answer on this instance; the call needs it, and answers CONFLICT_TOKEN_MISSING when it is left out or null
instanceConfirmation=the confirmation a refusal handed out for closing an instance with unfinished tasks; left out or null, the call closes an instance whose tasks are all closed
returnText=the text of the instance's return
returnVerdict=the verdict of the return, needed where the version asks for one; left out or null, the return carries its text and its outcome label alone
returnOutcome=one of the outcome labels of the version, as the read of the definition lists them under outcome_labels, needed where the version asks for one; left out or null, the return carries its text and its verdict alone
returnTranslationBasis=what translates the result into the outcome label, needed with every outcome label; left out or null, the return carries its text and its verdict alone
referenceKind=the kind of the reference
attachValue=the value of the reference, such as the address of a worklist item, kept as given
detachValue=the value of a reference the instance carries
