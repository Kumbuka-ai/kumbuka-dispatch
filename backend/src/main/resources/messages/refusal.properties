#
# The message of every refusal (DEC-0042, DEC-0043 R18 to R20).
# A message may state a finding in the negative; it repeats neither the
# caller's input nor the tenant's vocabulary.

notFound=nothing is addressed here. Check the address, and that you are a member of the scope it names.
stateDoesNotAllow={call} is not possible in the task's present state, which data.state shows. You can make: {#each calls}{it}{#if it_hasNext}, {/if}{/each}.
stateNothingOpen={call} is not possible in the task's present state, which data.state shows, and no call is open to you on it now; data.waiting_for says what it waits for.
stateClosed={call} is not possible on this task: it is closed and finished. Nothing further can be done with it.
contentFrozen={call} returns a task to draft before its first take-up, and this one was taken up: the take-up froze its content. Give it up with {withdraw}, or supplement it with {annotate} while the work runs.
bracketOccupied={call} returns a bracket root to draft while its bracket is empty, and tasks stand under this one. Withdraw it with its bracket through {withdraw}.
addendumBeforeTakeUp={call} adds to a task while its work runs, active or on_hold, and this one is open: its commission comes back to draft through {recall} up to the first take-up, and {withdraw} gives it up.
addendumAfterDelivery={call} adds to a task while its work runs, active or on_hold, and this one is delivered: {rework} sends the answer back with a remark.
roleCommissioner={call} is the commissioner's call, and you take part in this task in another part.
roleExecutor={call} is an executor's call, and you take part here in another part.
roleHolder={call} is the holder's call, and you take part in this task in another part.
roleAuthor={call} is the call of the identity that wrote the text it supplements.
roleOtherThanTheDeliverer={call} is the commissioner's call, made by an identity other than the one that delivered the answer.
roleCapacity={call} needs a caller holding the commissioning or the executing capacity, and exactly one of them.
holderOther={call} is the holder's call, and another executor holds this task.
holderNobody={call} is the holder's call, and nobody holds this task.
holderLapsed={call} is the holder's call, and your lease on this task ended.
textHolderOther={call} reads the text of a task its executor holds, and another executor holds this one.
textHolderNobody={call} reads the text of a task its executor holds, and nobody holds this one.
textHolderLapsed={call} reads the text of a task its executor holds, and your lease on this one ended.
receiptWrong={call} needs the receipt your claim handed out for this task: the receipt given is a different one.
childrenUnfinished={call} would close a bracket root while tasks of its bracket are unfinished; data.children lists them. Repeat the call with data.confirmation to withdraw them and close the root.
optionUnoffered={call} names an option the question does not offer; data.offenders names the field, and the read of the task lists the options.
freeTextUnoffered={call} answers in free text, and the question admits none; data.offenders names the field, and the read of the task lists the options.
rootUnsent={call} names a bracket root that is still a draft, and a child is created only under a root that was sent.
rootClosed={call} names a bracket root that is closed, and a closed root takes no further child.
childrenPresent={call} would delete a bracket root while tasks stand under it; data.children lists them, and nothing was deleted.
childrenConfirmationStale={call} carries a confirmation that no longer holds: the unfinished tasks of the bracket changed since it was handed out, and data.children lists them now. Repeat the call with the one in data.confirmation.
deferralPending={call} is not possible yet: the task is deferred, and {read} shows until when, in fields.not_before.
nothingToTake=Nothing that your patterns match can be taken up in this bracket kind right now: every such task is a draft, held, paused, delivered, closed or deferred.
claimDurationInvalid=duration is not valid for {call}: it is a positive ISO-8601 duration such as PT2H.
pageSizeRejected=page_size is not valid for {call}: it is a whole number from 1 to {max}.
cursorMalformed=after is not a cursor {query} handed out: it is the next_cursor of the previous page.
cursorForeign={call} carries a cursor of another listing: it was handed out for other values of {#each differs}{it}{#if it_hasNext}, {/if}{/each}. A cursor continues only the listing that handed it out.
sortUndeclared=sort is not valid for {call}: it takes id or created_at.
argumentUnknown={call} takes these arguments: {#each accepts}{it}{#if it_hasNext}, {/if}{/each}.
argumentUnknownUnderFields={call} takes these arguments under fields: {#each accepts}{it}{#if it_hasNext}, {/if}{/each}.
callUnknown=This service takes these calls: {#each accepts}{it}{#if it_hasNext}, {/if}{/each}.
methodNotCarried=This route takes other methods: the Allow header names them, and data.accepts the calls at this address.
argumentMissing={call} needs {path}.
argumentMissingOptions={call} needs fields.options, or fields.free_text set to true.
argumentMissingAnswer={call} needs fields.option or fields.text.
argumentMissingChange={call} needs at least one of fields.title, fields.apparatus, fields.text and fields.metadata.
invalidFieldsObject={path} is not valid for {call}: it carries the values this call writes, and is an object.
invalidString={path} is not valid for {call}: it is a string.
invalidOneOf={path} is not valid for {call}: it is one of the values the description of the argument lists.
invalidListOfStrings={path} is not valid for {call}: it is a list of strings, even when it carries one value.
invalidObject={path} is not valid for {call}: it is an object.
invalidBoolean={path} is not valid for {call}: it is true or false.
invalidWholeNumber={path} is not valid for {call}: it is a whole number.
invalidParentElsewhere={path} is not valid for {call}: it names another scope or bracket kind than the call does, and a child is created in its root's bracket.
invalidParentNotARoot={path} is not valid for {call}: a parent is a bracket root, the <number>.0 of its bracket.
invalidApparatusPattern={path} is not valid for {call}: a pattern is one or more of A-Z, a-z, 0-9, '+', '-' and '*', and '*' is the only wildcard; the underscore and the percent sign carry a meaning of their own in the comparison and are excluded.
invalidApparatusUnbounded={path} is not valid for {call}: a pattern of nothing but '*' matches every apparatus, which is the blind draw the argument exists to refuse.
invalidStateFilter={path} is not valid for {call}: it is one or more of draft, open, active, on_hold, delivered and closed, comma-separated.
invalidBracketFilter={path} is not valid for {call}: it is one or more bracket numbers, comma-separated.
invalidAddressFilter={path} is not valid for {call}: it is one or more complete task addresses, comma-separated.
invalidAddressFilterElsewhere={path} is not valid for {call}: a listing filters the tasks of its own scope and bracket kind.
invalidValueFilter={path} is not valid for {call}: it is one or more values, comma-separated.
invalidLeaseEnd={path} is not valid for {call}: a lease ends before the year 294276.
invalidInstant={path} is not valid for {call}: an instant is written in ISO-8601 with its offset, such as 2026-10-07T09:00:00Z.
invalidInstantRange={path} is not valid for {call}: an instant lies from 0001-01-01T00:00:00Z up to +294276-01-01T00:00:00Z.
invalidAnswerOneOfTwo={path} is not valid for {call}: an answer names an option or carries text, not both.
invalidAddress={path} is not valid for {call}: a task's address is written dispatch://<scope>/<selector>/<number>.<sub>.
invalidScope={path} is not valid for {call}: a scope's name is a DNS label: lower case, digits and inner hyphens.
invalidSelector={path} is not valid for {call}: a bracket kind's name is lower case, digits and inner hyphens.
invalidMetadata={path} is not valid for {call}: metadata carries your own keys, each value a string or a list of strings of at most 512 characters, and no URL carrying credentials.
invalidCurationTarget={path} is not valid for {call}: it names another task than this one.
invalidAddendumTarget={path} is not valid for {call}: it names a part the task carries a text of; the read of the task lists them under fields.texts.
invalidAddendaExhausted={path} is not valid for {call}: that text already carries addenda a to z, and a further letter would reissue one that exists.
invalidOnce={path} is not valid for {call}: it arrived twice: in the query or the body, and in the path or a header, and a call takes each argument once.
invalidBody={call} carries a body that is no JSON object: a body is a JSON object of the call's arguments.
headerInvalid=The header Kumbuka-Surface takes the one value assistant, once, or is left out.
scopeReserved=The names declaration and whoami are the REST surface's own paths and are no scope; a scope is named otherwise.
invalidInRequest={path} is not valid for this request: a task's address is written dispatch://<scope>/<selector>/<number>.<sub>.
valueInvalid=A value given is not valid for {call}: it is a value this call takes.
valueGivenTwice=A value given is not valid for {call}: it arrived twice, in the query or the body and in the path or a header, and a call takes each argument once.
conflictTokenStale={call} carries a conflict token that is not the one the task holds: it was changed since you read it. Its current token is in data.conflict_token.
selectorUnknown=selector names a bracket kind this scope does not declare.
selectorWithdrawn=selector names a bracket kind this scope has withdrawn.
scopeKindUnsupported=The scope named is of a kind this service carries no tasks in; it carries tasks in project and global scopes.
scopeReadOnly={call} writes, and you may read this scope without writing to it. Reading it is unaffected; the write right is granted with the membership.
scopeLocked=This scope is locked, so it refuses every write whatever your role. Reading it is unaffected. The lock is lifted where it was set.
idempotencyKeyReused=The idempotency key given was spent on a different call, or with different arguments, in this scope within the last 24 hours.
routeCreate={call} is a call on a bracket kind: POST /api/<scope>/<selector>.
routeQuery={call} is a call on a bracket kind: GET /api/<scope>/<selector>.
routeOnABracketKind={call} is a call on a bracket kind: POST /api/<scope>/<selector>:{call}.
routeRead={call} is a call on a task: GET /api/<scope>/<selector>/<number>.<sub>.
routeReadCall={call} is a call on a task: GET /api/<scope>/<selector>/<number>.<sub>:{call}.
routeUpdate={call} is a call on a task: PATCH /api/<scope>/<selector>/<number>.<sub>.
routeDelete={call} is a call on a task: DELETE /api/<scope>/<selector>/<number>.<sub>.
routeOnATask={call} is a call on a task: POST /api/<scope>/<selector>/<number>.<sub>:{call}.
unexpectedFailure={call} failed unexpectedly. This is a defect, not a rule. Nothing was changed. Report the reference in data.reference.
unexpectedFailureOfRequest=The request failed unexpectedly. This is a defect, not a rule. Nothing was changed. Report the reference in data.reference.
conflictTokenMissing={call} is fenced by the conflict token, and it arrived without one.
