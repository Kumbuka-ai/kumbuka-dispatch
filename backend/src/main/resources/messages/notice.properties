#
# What a task waits for, where nothing is open to the caller. A notice
# states a fact and may state it in the negative (DEC-0043 R21).

waitingDraft=the commissioner, to send it
waitingOpen=an executor to take it up
waitingDeferred=the instant in fields.not_before, and then an executor to take it up
waitingActive=its holder
waitingQuestion=the commissioner, to answer the question
waitingParked=a person, to move it out of the hold through the web interface, or the commissioner, to withdraw it: its lease lapsed three times and it has no holder
waitingResume=its holder, to resume it
waitingDelivered=the commissioner, to accept the answer or send it back
waitingClosed=nothing: the task is closed
