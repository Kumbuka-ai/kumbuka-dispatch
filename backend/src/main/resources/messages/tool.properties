#
# The description of every call, at most 500 characters each (concept
# section 3.5), worded as the act (DEC-0043 R21; PositivePhrasingLintTest).
# One per declared call: a call's description comes back with the change that
# declares it.

readDefinition=Reads one seeded version of the process a selector declares in a scope: its head with the outcome labels of an instance, its schema of control fields, the enumerations of its choice fields with their values in order, its activities with what a delivery of each needs and the fields of its result contract, its start contract, and the enumerations of the platform's system fields in the same form. Name the version by its number, or leave it out to read the active one.
