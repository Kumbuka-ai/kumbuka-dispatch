#
# The description of every call, at most 500 characters each (concept
# section 3.5), worded as the act (DEC-0043 R21; PositivePhrasingLintTest).
# One per declared call: a call's description comes back with the change that
# declares it.

start=Starts an instance of a selector in a scope, bound to the version of its definition in force: with its title, an input text, a trigger reference, the worklist items and other objects it serves, and under fields.values the field values its start contract names, each checked against the contract and the schema the read of the definition answers. Answers the new instance with its address dispatch://<scope>/<selector>/<number>, its conflict token and the calls open on it.
conclude=Closes a running instance as concluded, with its return: a text, and the verdict and the outcome label the version asks for, each label with its translation basis. Send the conflict token of your last answer on the instance. Where tasks of the instance are still open, the first call answers CHILDREN_UNFINISHED with the tasks and a confirmation; the same call with that confirmation withdraws them and closes the instance in one step.
withdraw=Withdraws a running instance and closes it as withdrawn, with its return: a text, and the verdict and the outcome label the version asks for, each label with its translation basis. Send the conflict token of your last answer on the instance. Where tasks of the instance are still open, the first call answers CHILDREN_UNFINISHED with the tasks and a confirmation; the same call with that confirmation withdraws them and closes the instance in one step.
referenceAttach=Sets a reference of a running instance to an object outside the service, by its kind and its value: a worklist item as kind item, any other object as kind reference. The service keeps the value as given. Setting a reference the instance already carries keeps the one it has and answers the instance.
referenceDetach=Ends a reference of a running instance, by its kind and its value. The ended reference stays on record with the act that ended it. A reference ends once, and the trigger of an instance stays for good.
readDefinition=Reads one seeded version of the process a selector declares in a scope: its head with the outcome labels of an instance, its schema of control fields, the enumerations of its choice fields with their values in order, its activities with what a delivery of each needs and the fields of its result contract, its start contract, and the enumerations of the platform's system fields in the same form. Name the version by its number, or leave it out to read the active one.
