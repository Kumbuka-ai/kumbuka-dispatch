#
# The description of every call, at most 500 characters each (concept
# section 3.5), worded as the act (DEC-0043 R21; PositivePhrasingLintTest).

send=Sends your draft: it opens for an executor to take it up. Moves the task from draft to open (intermediate). Call as the commissioner, with the conflict token of your last read.\n\nUntil the first take-up, dispatch_recall takes it back to draft for you to change and send again; from the first take-up on its text stays as sent, and dispatch_annotate supplements it while the work runs. Withdraw the task with dispatch_withdraw.
recall=Takes your sent task back to draft, up to the moment an executor first takes it up. Moves the task from open to draft (intermediate). Call as the commissioner, with the conflict token of your last read. A bracket root comes back while its bracket is empty.\n\nChange the draft with dispatch_update and send it again with dispatch_send; the new text replaces the one sent. From the first take-up on the text stays as sent: give the task up with dispatch_withdraw.
claim=Takes up one open task and makes you its holder. Moves the task from open to active (intermediate). Call as an executor, naming the task by its address.\n\nReturns a receipt and the end of your hold. Keep the receipt: every later call on this task needs it.\n\nThe task's text comes from dispatch_read_text, part "dispatch": read it next, before you start working.\n\nYour hold lasts 30 minutes, or the duration you state; extend it with dispatch_renew.
claimNext=Retiring: take up a task by its address with dispatch_claim; this call stays served while callers move. Takes up the next open task addressed to you, chosen by the service. Moves the task from open to active (intermediate). Call as an executor with scope, selector and apparatus.\n\nReturns the address, a receipt and the end of your hold. Keep the receipt: every later call on this task needs it.\n\nThe task's text comes from dispatch_read_text, part "dispatch": read it next, before you start working.
release=Gives a task you hold back: it is open again for any executor. Moves the task from active to open (intermediate). Call as its holder, with your receipt, when you lose control over the run.\n\nTo give it back until a later instant use dispatch_defer; to close it as failed, dispatch_fail.
defer=Gives a task you hold back until an instant you name; from that instant on an executor can take it up. Moves the task from active to open (intermediate). Call as its holder, with your receipt, for a technical abort that a later attempt may overcome.\n\ndispatch_read and dispatch_query show the instant.
renew=Extends your hold on a task you are working on. The task stays active (intermediate). Call as its holder, with your receipt.\n\nThe answer carries the new end of your hold.
ask=Pauses a task you hold and asks the commissioner a question, with answer options, free text admitted, or both. Moves the task from active to on_hold (intermediate). Call as its holder, with your receipt.\n\nYou keep the task. The commissioner's dispatch_answer makes it active again with a fresh 30-minute hold; read the answer with dispatch_read_text, part "thread".
answer=Answers the question the holder asked: name one of its options, or give text where free text is admitted. Moves the task from on_hold to active (intermediate); the holder continues with a fresh 30-minute hold. Call as the commissioner, with the conflict token of your last read.\n\nRead the question first with dispatch_read_text, part "thread".
hold=Pauses a task you hold while it waits on a dependency or on something external. Moves the task from active to on_hold (intermediate). Call as its holder, with your receipt. You keep the task, and your hold stays in place while the task is paused.\n\nContinue with dispatch_resume.
resume=Continues a task you paused with dispatch_hold. Moves the task from on_hold to active (intermediate). Call as its holder, with your receipt.\n\nA question you asked continues with the commissioner's dispatch_answer.
deliver=Delivers your answer, its text and your metadata in one act. Moves the task from active to delivered (intermediate). Call as its holder, with your receipt.\n\nYou keep the task while the commissioner reviews it. The commissioner closes it with dispatch_accept, or sends it back to you with a remark through dispatch_rework.
rework=Sends a delivered answer back to its holder with a remark saying what to change. Moves the task from delivered to active (intermediate); the holder continues with a fresh 30-minute hold. Call as the commissioner, with the conflict token of your last read.\n\nRead the answer first with dispatch_read_text, part "return".
accept=Accepts the delivered answer and closes the task. Moves the task from delivered to closed, outcome accepted (final). Call as the commissioner, with the conflict token of your last read; acceptance is the act of an identity other than the one that delivered.\n\nRead the answer first with dispatch_read_text, part "return". On a bracket root with unfinished children, repeat with the confirmation the refusal hands out.
reject=Declines a commission you were offered, with a remark saying why. Moves the task from open to closed, outcome rejected (final). Call as an executor.
fail=Closes a task you hold as failed, with a remark saying why. Moves the task from active or on_hold to closed, outcome failed (final). Call as its holder, with your receipt. For a technical abort use dispatch_defer; to hand the task back, dispatch_release.\n\nOn a bracket root with unfinished children, repeat with the confirmation the refusal hands out.
withdraw=Withdraws a commission you give up. Moves the task from open, active, on_hold or delivered to closed, outcome withdrawn (final). Call as the commissioner, with the conflict token of your last read.\n\nOn a bracket root with unfinished children the first call is refused and names them; repeat it with the confirmation it hands out to withdraw them and the root together.
create=Creates a task as a draft, for you to complete and send. With parent it adds a child to that bracket; left out, it opens a new bracket and the task is its root. The service allocates the number. Call as a commissioner; you become the task's commissioner.\n\nThe draft stays yours until you send it with dispatch_send. Change it with dispatch_update, or discard it with dispatch_delete.
update=Changes your draft: its title, apparatus, text or metadata; what you leave out stays as it is. Call as the commissioner, with the conflict token of your last read. The task stays a draft.\n\nA sent task comes back to draft with dispatch_recall up to its first take-up; from then on it keeps its text.
delete=Deletes your draft outright and removes every trace of it. Call as the commissioner, with the conflict token of your last read. Deleting applies to a draft; a sent task is withdrawn with dispatch_withdraw.\n\nThe answer carries the address the draft had, and that alone.
read=Reads the head of one task: its state and attributes, whether you or another executor holds it, its metadata, which texts it has, and the calls open to you with what each does, or what the task waits for.\n\nThe task's text comes from dispatch_read_text.
readText=Reads one part of a task's text: "dispatch" (the commission), "return" (the valid answer), "thread" (questions, answers, remarks and earlier answers, in order) or "addenda". One part per call.\n\nThe commissioner reads every part in every state; an executor reads the parts of a task it holds. For "dispatch" and "return" the answer says how many addenda the text has.
query=Lists the tasks of one bracket kind in a scope, each with its head: its state, attributes and the calls open to you. Narrow by state, apparatus, bracket or address, the four declared filters; comma-separated values are alternatives.\n\nOne page per call, in address order or in the order sort names. While next_cursor is in the answer, more follow: pass it as after, with the same other arguments, for the next page.
annotate=Adds an addendum to a text of a task whose work runs, active or on_hold: a supplement with its own time and author that stays for good. Name the part it supplements. Call as the identity that wrote that text; the task keeps its state.\n\nBefore the first take-up, change the commission through dispatch_recall; a delivered answer goes back with dispatch_rework. Read addenda with dispatch_read_text, part "addenda".
relate=Records the object a closed task was curated into: another task you can see, in any scope and bracket kind, other than the task itself. Call as the commissioner, with the conflict token of your last read. The task stays closed.\n\nRemove the relation with dispatch_unrelate.
unrelate=Removes the record of the object a closed task was curated into. Call as the commissioner, with the conflict token of your last read. The task stays closed.
