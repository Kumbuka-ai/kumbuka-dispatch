#
# The description of every value of a closed set (DEC-0043 R21;
# PositivePhrasingLintTest).

holdReasonDependency=the task waits on another piece of work
holdReasonExternal=the task waits on something outside the platform
readTextPartDispatch=the commission
readTextPartReturn=the valid answer
readTextPartThread=the questions, answers, remarks and earlier answers, in order
readTextPartAddenda=the supplements added to the texts
annotatePartDispatch=the commission
annotatePartReturn=the answer
annotatePartQuestion=a question the holder asked
annotatePartAnswer=an answer to a question
annotatePartRemark=a remark
sortId=the address: the number, then the sub, each numerically
sortCreatedAt=the time of creation, then the address
directionAsc=ascending: the smallest first
directionDesc=descending: the largest first
