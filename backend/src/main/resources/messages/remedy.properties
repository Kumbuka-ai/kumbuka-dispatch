#
# The remedy of every refusal reason, one per code: the act the caller
# performs next, worded positively (DEC-0043 R21; PositivePhrasingLintTest).

payloadMalformed=Send the body as one JSON object.
addressMalformed=Write the address in the form the declaration names for it.
argumentUnknown=Use the names in data.accepts.
argumentMissing=Repeat the call with the argument in data.offenders.
argumentInvalid=Send the argument in data.offenders in the form the message describes.
headerInvalid=Send Kumbuka-Surface once with the value assistant, or leave it out.
pageSizeRejected=Send page_size as a whole number within the bounds the message names.
cursorMalformed=Call the query again from the first page.
cursorForeign=Repeat the call with the arguments that handed the cursor out.
sortUndeclared=Send sort as id or created_at.
roleInsufficient=Make one of the calls in data.next.
scopeReadOnly=Ask whoever administers the membership of this scope for the write right.
notFound=Check the scope and the address.
verbNotCarried=Send one of the calls in data.accepts, on the route the message names.
transitionRefused=Make one of the calls in data.next.
claimAbsent=Claim the task where it is open, then repeat the call with the new receipt.
claimHeld=Wait until its holder gives the task back, or take up another task.
receiptWrong=Pass the receipt from your latest claim.
drawEmpty=List the tasks with the query call.
childrenNotFinished=Repeat the call with data.confirmation, or finish the tasks in data.children first.
deferralPending=Take the task up after that instant, or take up another task now.
idempotencyKeyReused=Choose a new key.
scopeLocked=Wait for the lock to be lifted, or read instead.
conflictTokenStale=Read the task again and repeat the call with data.conflict_token.
selectorUndeclared=Name a bracket kind the scope declares.
selectorWithdrawn=Name a bracket kind the scope still offers.
scopeKindUnsupported=Name a project or a global scope.
conflictTokenMissing=Read the task, then repeat the call with its conflict token.
unexpectedFailure=Report the reference.
