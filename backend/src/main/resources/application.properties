# ===========================================================================
# The dispatch service.
#
# Every value below that names an environment carries the DISPATCH_ prefix
# and a development default that points at localhost. There is no deployment
# hostname in this file, and none belongs here: this repository is public,
# and a default that happens to name a real host is a deployment detail that
# has escaped its deployment.
# ===========================================================================

quarkus.application.name=dispatch
quarkus.http.port=8080

quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.level=INFO
# INFO in production. DEBUG is the trace inside a verb and is switched on when
# somebody is looking; INFO is the completed transition and the service start,
# which is what a running deployment should say without being asked.
quarkus.log.category."ai.kumbuka.dispatch".level=INFO

# ---------------------------------------------------------------------------
# Datasource — the RUNTIME connection.
#
# The service connects as its own role and as nothing else. That role OWNS
# NOTHING: it holds USAGE on this service's schema plus SELECT, INSERT and
# UPDATE on three named tables, written out in V8, and nothing else anywhere.
# It carries neither superuser nor BYPASSRLS — which is what makes the
# row-level-security policies bind it at all.
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DISPATCH_DB_USERNAME:kumbuka_dispatch}
quarkus.datasource.password=${DISPATCH_DB_PASSWORD:change-me-kumbuka-dispatch}
quarkus.datasource.jdbc.url=${DISPATCH_DB_JDBC_URL:jdbc:postgresql://localhost:5432/kumbuka}

# Hibernate's @TenantId filter sends the tenant as the entity field's type
# (String, because the Quarkus tenant-resolver SPI is String-only) while the
# column is `uuid`. Without this, pgjdbc tags the parameter as VARCHAR and
# PostgreSQL rejects `uuid = varchar`; with it, the type is inferred from the
# column instead.
quarkus.datasource.jdbc.additional-jdbc-properties.stringtype=unspecified

# ---------------------------------------------------------------------------
# Flyway — the MIGRATING connection, deliberately a different role.
#
# The migration set creates a role, which is a privileged act. Splitting the
# two connections is what lets the runtime role stay unprivileged; running
# both as one role would mean either a privileged service or a migration that
# cannot create its own role.
#
# The migrator KEEPS what it creates — schema, tables and every future view or
# sequence. Nothing is handed over afterwards. What the runtime role may do is
# written out grant by grant in V8, which also refuses to apply under a
# migrator carrying superuser or BYPASSRLS: the migrator owns every view, and
# a view without `security_invoker` reads its base tables with its owner's
# privileges, so either attribute would void the tenant filter silently.
#
# The development defaults below are `postgres`/`postgres` and V8 refuses
# under them. That is the intended shape rather than an oversight — a
# deployment supplies a CREATEROLE role that carries neither attribute, and a
# migrator that is the superuser has never been an acceptable configuration
# here: it also lets V5 pass its FORCE-RLS check with the tenant
# callback silently unregistered).
# ---------------------------------------------------------------------------
quarkus.flyway.migrate-at-start=true
quarkus.flyway.default-schema=dispatch
quarkus.flyway.schemas=dispatch
quarkus.flyway.create-schemas=true
quarkus.flyway.username=${DISPATCH_MIGRATOR_USERNAME:postgres}
quarkus.flyway.password=${DISPATCH_MIGRATOR_PASSWORD:postgres}
quarkus.flyway.jdbc-url=${DISPATCH_DB_JDBC_URL:jdbc:postgresql://localhost:5432/kumbuka}

# Callbacks are resolved from THIS key by class name and instantiated
# reflectively. The extension does NOT discover them as CDI beans, and a
# callback left out of this line is never registered — with no warning, no
# error, and migrations that run happily without it. The one class named here
# has a probe that observes it firing, because that is the only way this line
# can be known to be right.
#
# There was a second: SchemaOwnershipCallback, which handed the schema and
# every relation in it to the runtime role after each run. It is deleted, not
# disabled. An owner holds the full ACL on what it owns implicitly — including
# TRUNCATE, which bypasses row-level security entirely — and the sweep took
# the Flyway history table with the rest, because that table lives in this
# schema too. V8 replaces it with enumerated grants.
quarkus.flyway.callbacks=ai.kumbuka.dispatch.tenancy.TenantMigrationCallback

# Flyway owns the schema; Hibernate only checks that it matches. Generating
# DDL from the entities would let a mapping change rewrite the database
# without a migration, and a row-level-security policy is exactly the kind of
# thing such a rewrite drops silently.
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.database.default-schema=dispatch
quarkus.hibernate-orm.log.sql=false

# The jsonb metadata columns serialise through Hibernate's own JSON facility,
# not through the REST ObjectMapper. Reusing the REST one for database columns
# is what Quarkus refuses by default — a customiser meant for the wire would
# then decide how a column is written, and a change made for an API response
# would silently rewrite stored rows.
quarkus.hibernate-orm.mapping.format.global=ignore

# Layer 1 of tenant enforcement: Hibernate filters every ORM-routed statement
# on @TenantId. Layer 2 is the database policy (V3). The current-tenant lookup
# runs through HibernateTenantResolver, which reads TenantContext.current().
quarkus.hibernate-orm.multitenant=DISCRIMINATOR

# ---------------------------------------------------------------------------
# Identity — the tenant realm, and no other.
#
# A bearer resource server: the audience and the issuer are both checked, so a
# token minted by another realm of the same server is refused rather than
# merely unauthorised. The operator realm is one such other realm, and its
# tokens are refused here on purpose — provider-plane identity is not an
# authorisation for a tenant's exchanges.
# ---------------------------------------------------------------------------
quarkus.oidc.auth-server-url=${DISPATCH_OIDC_ISSUER:http://localhost:8180/realms/kumbuka}
quarkus.oidc.client-id=${DISPATCH_OIDC_CLIENT_ID:kumbuka-dispatch}
quarkus.oidc.application-type=service
quarkus.oidc.token.audience=${DISPATCH_OIDC_AUDIENCE:kumbuka-dispatch}
quarkus.oidc.roles.source=accesstoken
quarkus.oidc.roles.role-claim-path=realm_access/roles

# Authorship is derived from the token's stable subject, never from a display
# name. Quarkus' default for a service application falls through
# upn -> preferred_username -> sub, so an email address can end up recorded as
# the actor — and an identifier that can change is one that stops matching the
# rows it wrote.
quarkus.oidc.token.principal-claim=sub

# ---------------------------------------------------------------------------
# Service configuration.
# ---------------------------------------------------------------------------
# The tenancy axis for this deployment. Read by ConfiguredTenantResolver and
# by the Flyway callback that binds the GUC for migrations carrying DML.
dispatch.tenant-id=${DISPATCH_TENANT_ID:00000000-0000-0000-0000-000000000001}

# This deployment's own scope — the one whose bracket names V5 declares.
#
# It is NOT a substitute for resolving a scope: every request resolves the
# scope it names against the platform's published read contract, and this
# value is only the identity of the estate this deployment runs for. A scope
# belonging to somebody else never appears here.
dispatch.scope-id=${DISPATCH_SCOPE_ID:00000000-0000-0000-0000-000000000010}

# Flyway placeholders for the declaration in V5. They are written as
# placeholders rather than read from the session setting on purpose: the
# setting is what the policy checks the incoming row AGAINST, so taking the
# value from it would make the row trivially satisfy the policy and the probe
# would prove nothing.
quarkus.flyway.placeholders.dispatchTenantId=${dispatch.tenant-id}
quarkus.flyway.placeholders.dispatchScopeId=${dispatch.scope-id}

# `dispatch.database.schema` and `dispatch.database.role` stood here. They
# were SchemaOwnershipCallback's configuration and nothing else read them —
# the comment claiming the conformance probe did was wrong when it was
# written. The schema and the role are now named where they are used: in the
# migrations, which write them as literals exactly as V2 always has, and in
# the privilege probe, which reads `quarkus.flyway.default-schema` and
# `quarkus.datasource.username` — the two settings the application itself runs
# on, rather than a duplicate pair that could agree with each other while
# disagreeing with the database.

quarkus.smallrye-health.root-path=/q/health
