# ===========================================================================
# Test profile.
#
# The datasource is supplied by SubstrateDatabaseResource, which starts a real
# PostgreSQL and points the runtime connection at the service's own role. It
# is NOT supplied by a development service: a development datasource connects
# as a superuser, a superuser bypasses row-level security, and every isolation
# assertion would then pass against a schema with the policies deleted.
# ===========================================================================

quarkus.devservices.enabled=false

# Identity is off by default. The realm binding is a statement about a running
# identity provider and is made in RealmBindingIT, which starts one and
# enables the tenant for itself. The remaining probes are statements about a
# database and would only pay a container's startup for nothing.
quarkus.oidc.tenant-enabled=false

# The tenancy axis under test, and this deployment's scope. Any two uuids
# would do; recognisable ones make a failure message legible.
#
# Set HERE and no longer carried by a default in the shipped configuration.
# That is the whole of the change: a deployment supplies both through
# DISPATCH_TENANT_ID and DISPATCH_SCOPE_ID, and a test supplies them like any
# other deployment does. TenancyConfigurationRefusalTest reads the shipped
# file directly, with nothing behind it, which is what observes the absence of
# the defaults rather than the presence of these two lines.
dispatch.tenant-id=00000000-0000-0000-0000-000000000001
dispatch.scope-id=00000000-0000-0000-0000-000000000010

# Coverage for the static-analysis gate. The quarkus-jacoco extension reads
# these; without them the @QuarkusTest classes run under a classloader the
# report never sees, and nearly all of this service's code would be reported
# as untested — a number that would read as a regression rather than as a
# missing setting.
%test.quarkus.jacoco.data-file=target/jacoco-quarkus.exec
%test.quarkus.jacoco.report=false
%test.quarkus.jacoco.reuse-data-file=true
